<!DOCTYPE html>
<!-- A standalone audio check, written in ES5 so that it parses on any WebKit
     old enough to be the reason the app is silent. Nothing here is part of the
     app: it exists to tell one failure apart from another on a device I cannot
     run myself. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScaleTune audio check</title>
<style>
  body{font:16px/1.45 -apple-system,system-ui,sans-serif;margin:0;padding:14px;
       background:#111;color:#eee}
  h1{font-size:19px;margin:0 0 10px}
  button{display:block;width:100%;margin:8px 0;padding:14px;font-size:17px;
         border-radius:10px;border:1px solid #4a8;background:#1c2a24;color:#dff}
  button.alt{border-color:#a84;background:#2a241c;color:#fed}
  pre{white-space:pre-wrap;word-break:break-word;background:#000;color:#9f9;
      padding:10px;border-radius:8px;font-size:13px;margin:10px 0}
  .err{color:#f88}
  .sec{margin-top:16px;border-top:1px solid #333;padding-top:10px}
  #verdict{font-size:17px;line-height:1.4;margin:12px 0}
  #verdict div{padding:10px 12px;border-radius:8px;margin:6px 0;
               background:#1a2a1a;border:1px solid #3a5}
  #verdict div.no{background:#2a1a1a;border-color:#a44}
  iframe{width:100%;height:340px;border:1px solid #444;border-radius:8px;
         background:#fff;margin-top:10px}
</style>
</head>
<body>
<h1>ScaleTune — verificação</h1>
<p>Os quatro primeiros fazem som. Os dois últimos não fazem som nenhum:
abrem a app aqui dentro e carregam no Start por ti. A resposta aparece
na caixa verde ou vermelha.</p>

<button id="b1">1 — Web Audio beep (oscillator)</button>
<button id="b2" class="alt">2 — &lt;audio&gt; element beep</button>
<button id="b3">3 — Drum sample (decodeAudioData)</button>
<button id="b4">4 — Strings sample (soundfont-player)</button>

<div class="sec">
  <button id="b5" class="alt">5 — Abrir a app aqui dentro</button>
  <button id="b6" class="alt">6 — Carregar no Start da app</button>
</div>

<div id="verdict"></div>
<div id="frame-slot"></div>

<div class="sec">
  <button id="bcopy" class="alt">Copy this report</button>
</div>

<pre id="log">starting...</pre>

<script>
var logEl = document.getElementById('log');
var lines = [];
function say(s, bad){
  lines.push(s);
  logEl.innerHTML = lines.map(function(l){
    return /^!/.test(l) ? '<span class="err">' + esc(l) + '</span>' : esc(l);
  }).join('\n');
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function bad(s){ say('! ' + s); }

/* The one line Carl has to read. Everything else in this page is for me. */
function verdict(s, ok){
  var d = document.createElement('div');
  if (!ok) d.className = 'no';
  d.textContent = s;
  document.getElementById('verdict').appendChild(d);
}

window.onerror = function(m, f, l){ bad('window error: ' + m + ' @' + l); };
window.addEventListener('unhandledrejection', function(e){
  bad('unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});

/* ---- environment ---- */
say('UA: ' + navigator.userAgent);
say('screen: ' + screen.width + 'x' + screen.height + ' dpr ' + (window.devicePixelRatio || 1));
say('standalone (installed): ' + (navigator.standalone === true));
say('secure context: ' + (window.isSecureContext === true));
say('AudioContext: ' + (!!window.AudioContext) + '  webkitAudioContext: ' + (!!window.webkitAudioContext));
say('navigator.audioSession: ' + (('audioSession' in navigator) ? 'yes' : 'NO (mute switch will silence Web Audio)'));
say('service worker controlled: ' + (navigator.serviceWorker && !!navigator.serviceWorker.controller));

/* Older workers stored any HTML document as the app's offline page, this one
   included. Asking the worker to update repairs that: the new one keeps a new
   cache and deletes the old. */
try {
  if (navigator.serviceWorker) {
    navigator.serviceWorker.register('sw.js').then(function(r){
      r.update();
      say('service worker updated');
    })['catch'](function(e){ say('service worker: ' + e.message); });
  }
} catch (e) {}

/* What the device is holding offline. An installed app opened with no network
   — or with a worker that never updated — runs from this copy, so a version
   here that is not the one on the server is itself the answer. */
/* Late, because a worker installing right now is still filling its cache. */
setTimeout(function(){
  if (window.caches && caches.keys) {
    caches.keys().then(function(names){
      say('caches: ' + (names.length ? names.join(', ') : 'none'));
      return caches.match('index.html', {ignoreSearch: true});
    }).then(function(res){
      if (!res) { say('no offline copy of the app held'); return; }
      return res.text().then(function(t){
        var m = /APP_VERSION\s*=\s*'([^']+)'/.exec(t);
        say('offline copy holds: ' + (m ? m[1] : 'no version — not the app!'));
      });
    })['catch'](function(e){ say('caches: ' + e.message); });
  }
}, 2500);

/* Which build of the app this device would actually get. */
try {
  var x = new XMLHttpRequest();
  x.open('GET', 'index.html?probe=' + Date.now(), true);
  x.onload = function(){
    var m = /APP_VERSION\s*=\s*'([^']+)'/.exec(x.responseText || '');
    say('index.html reachable: ' + x.status + '  APP_VERSION: ' + (m ? m[1] : 'not found'));
  };
  x.onerror = function(){ bad('index.html could not be fetched'); };
  x.send();
} catch (e) { bad('probe threw: ' + e.message); }

/* ---- audio context ---- */
var ctx = null, master = null;
function ac(){
  if (!ctx) {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) { bad('no AudioContext constructor at all'); return null; }
    ctx = new C();
    master = ctx.createGain();
    master.gain.value = 0.6;
    master.connect(ctx.destination);
    say('context created: state=' + ctx.state + ' sampleRate=' + ctx.sampleRate);
  }
  try {
    var p = ctx.resume();
    if (p && p.then) p.then(function(){ say('after resume: state=' + ctx.state); });
  } catch (e) { bad('resume threw: ' + e.message); }
  return ctx;
}
/* currentTime standing still is the deadlock the app's scheduler would hit. */
function clockCheck(){
  if (!ctx) return;
  var t0 = ctx.currentTime;
  setTimeout(function(){
    var moved = ctx.currentTime - t0;
    say('clock moved ' + moved.toFixed(3) + ' s in 500 ms — state=' + ctx.state +
        (moved > 0.05 ? ' (running)' : ' (STUCK)'));
  }, 500);
}

document.getElementById('b1').onclick = function(){
  say('--- test 1: oscillator ---');
  var c = ac(); if (!c) return;
  try {
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 440;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(master);
    var t = c.currentTime + 0.05;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.start(t); o.stop(t + 0.8);
    say('scheduled a 440 Hz beep at t+0.05');
    clockCheck();
  } catch (e) { bad('test 1 threw: ' + e.message); }
};

/* A <audio> element plays through the media session, which the ring/silent
   switch does not touch. Hearing 2 but not 1 means the switch, not the app. */
function wavDataUri(freq, secs){
  var sr = 22050, n = Math.floor(sr * secs), i, d = [];
  function s16(v){ d.push(String.fromCharCode(v & 255, (v >> 8) & 255)); }
  function str(s){ d.push(s); }
  function u32(v){ d.push(String.fromCharCode(v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >> 24) & 255)); }
  str('RIFF'); u32(36 + n * 2); str('WAVEfmt '); u32(16); s16(1); s16(1);
  u32(sr); u32(sr * 2); s16(2); s16(16); str('data'); u32(n * 2);
  for (i = 0; i < n; i++) {
    var env = Math.min(1, i / 200) * Math.max(0, 1 - i / n);
    s16(Math.round(Math.sin(2 * Math.PI * freq * i / sr) * 12000 * env) & 65535);
  }
  return 'data:audio/wav;base64,' + btoa(d.join(''));
}
document.getElementById('b2').onclick = function(){
  say('--- test 2: <audio> element ---');
  try {
    var a = new Audio(wavDataUri(440, 0.8));
    a.volume = 1;
    var p = a.play();
    if (p && p.then) p.then(function(){ say('audio element playing'); })
                      .catch(function(e){ bad('audio element refused: ' + e.message); });
    else say('audio element play() returned nothing (old WebKit)');
  } catch (e) { bad('test 2 threw: ' + e.message); }
};

document.getElementById('b3').onclick = function(){
  say('--- test 3: decodeAudioData ---');
  var c = ac(); if (!c) return;
  var x = new XMLHttpRequest();
  x.open('GET', 'vendor/drums/hhc.wav', true);
  x.responseType = 'arraybuffer';
  x.onload = function(){
    say('hhc.wav: status ' + x.status + ' bytes ' + (x.response ? x.response.byteLength : 0));
    try {
      c.decodeAudioData(x.response, function(buf){
        say('decoded: ' + buf.duration.toFixed(3) + ' s, ' + buf.numberOfChannels + ' ch');
        var s = c.createBufferSource();
        s.buffer = buf; s.connect(master); s.start(c.currentTime + 0.05);
      }, function(e){ bad('decodeAudioData failed: ' + (e && e.message ? e.message : e)); });
    } catch (e) { bad('decodeAudioData threw: ' + e.message); }
  };
  x.onerror = function(){ bad('hhc.wav could not be fetched'); };
  x.send();
};

document.getElementById('b4').onclick = function(){
  say('--- test 4: soundfont-player ---');
  var c = ac(); if (!c) return;
  function go(){
    if (typeof Soundfont === 'undefined') { bad('Soundfont is undefined after loading the script'); return; }
    say('Soundfont loaded, asking for strings...');
    try {
      Soundfont.instrument(c, 'strings', {
        soundfont: 'FluidR3_GM',
        destination: master,
        nameToUrl: function(){ return 'vendor/strings-aac.js'; }
      }).then(function(inst){
        say('strings ready — playing C3');
        inst.play('C3', c.currentTime + 0.05, {duration: 1.5});
      })['catch'](function(e){ bad('strings failed: ' + (e && e.message ? e.message : e)); });
    } catch (e) { bad('test 4 threw: ' + e.message); }
  }
  if (typeof Soundfont !== 'undefined') { go(); return; }
  var s = document.createElement('script');
  s.src = 'vendor/soundfont-player.min.js';
  s.onload = go;
  s.onerror = function(){ bad('soundfont-player.min.js could not be loaded'); };
  document.head.appendChild(s);
};

/* The app in a frame, same origin, so its errors and its globals can be read
   from here. A script that dies part way through leaves the names defined
   before the fault and nothing after it — which says where it died. */
var appWin = null;                 // the app's own window, once test 5 has run
var appErrors = [];
function watchApp(w){
  function note(m){ appErrors.push(m); bad('app error: ' + m); }
  try {
    w.onerror = function(m, file, l, c, err){
      note(m + ' @line ' + l + (err && err.stack ? ' | ' + String(err.stack).split('\n')[0] : ''));
    };
    w.addEventListener('unhandledrejection', function(e){
      note('rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
  } catch (e) {}
}

document.getElementById('b5').onclick = function(){
  say('--- test 5: the app itself ---');
  document.getElementById('frame-slot').innerHTML = '';
  var f = document.createElement('iframe');
  f.src = 'index.html?frame=' + Date.now();
  document.getElementById('frame-slot').appendChild(f);
  try { watchApp(f.contentWindow); } catch (e) {}
  f.onload = function(){
    var w = f.contentWindow;
    appWin = w;
    watchApp(w);
    /* A script that dies part way through leaves the names declared before the
       fault and nothing after it, so probing in file order says where it died. */
    var probes = ['APP_VERSION', 'initAudio', 'loadSampler', 'togglePlay',
                  'pintaFaders', 'swallowsSpace'];
    var out = [], died = null;
    for (var i = 0; i < probes.length; i++) {
      var have = false;
      /* `let` and `const` at the top level of a classic script are not window
         properties, so asking the frame itself is the only way to see them. */
      try {
        have = typeof w[probes[i]] !== 'undefined' ||
               w.eval('typeof ' + probes[i]) !== 'undefined';
      } catch (e) {}
      out.push((have ? 'ok  ' : 'MISSING ') + probes[i]);
      if (!have && died === null) died = probes[i];
    }
    say(out.join('\n'));
    var v = '—';
    try { v = w.eval('typeof APP_VERSION!=="undefined"?APP_VERSION:"—"'); } catch (e) {}
    say('app version in the frame: ' + v);
    if (died) verdict('5 — a app parou a meio: falta "' + died + '". É aqui o problema.', false);
    else verdict('5 — a app carregou inteira neste iPad (versão ' + v + '). Agora o 6.', true);
  };
};

/* Pressing Start from here, inside the same tap, and counting what the engine
   actually schedules. Metro because it needs no samples: a click and nothing
   else, so a silence here is the metronome itself. */
document.getElementById('b6').onclick = function(){
  say('--- test 6: Start inside the app ---');
  var w = appWin;
  if (!w) { verdict('6 — carrega primeiro no 5.', false); return; }
  var clicks = 0, tones = 0;
  function count(name, hit){
    try {
      var orig = w[name];
      if (typeof orig !== 'function') { say(name + ' is not a global function in the frame'); return; }
      w[name] = function(){ hit(); return orig.apply(this, arguments); };
    } catch (e) { bad('could not wrap ' + name + ': ' + e.message); }
  }
  count('scheduleClick', function(){ clicks++; });
  count('scheduleTone', function(){ tones++; });

  function ask(what){ try { return w.eval(what); } catch (e) { return '?'; } }
  function statusText(){
    try { return w.document.getElementById('status-bar').textContent; } catch (e) { return ''; }
  }
  function ctxState(){ return ask('typeof audioCtx!=="undefined"&&audioCtx?audioCtx.state:"no context"'); }
  function clock(){ var t = ask('typeof audioCtx!=="undefined"&&audioCtx?audioCtx.currentTime:0');
                    return typeof t === 'number' ? t : 0; }

  /* Two rounds: the metronome, which needs nothing but a click, and a scale,
     which needs the samples. Whichever one is silent says where to look. */
  function round(mode, prep, wait, done){
    clicks = 0; tones = 0;
    var t0 = clock();
    try {
      w.eval('setMode("' + mode + '")');
      if (prep) w.eval(prep);
      w.eval('togglePlay()');
    }
    catch (e) { bad('Start in ' + mode + ' threw: ' + e.message); }
    setTimeout(function(){
      var r = {mode: mode, clicks: clicks, tones: tones, ctx: ctxState(),
               moved: clock() - t0, playing: ask('typeof state!=="undefined"?String(state.playing):"?"'),
               status: statusText()};
      say(mode + ': playing=' + r.playing + ' context=' + r.ctx +
          ' clock+' + (r.moved || 0).toFixed(2) + 's clicks=' + r.clicks +
          ' notes=' + r.tones + ' status="' + r.status + '"');
      try { w.eval('if(state.playing)togglePlay()'); } catch (e) {}
      done(r);
    }, wait);
  }

  function judge(r, label){
    if (r.ctx !== 'running')
      return verdict(label + ' — o som ficou suspenso (contexto "' + r.ctx +
                     '"). É o iOS a não deixar arrancar.', false);
    if ((r.moved || 0) < 0.05)
      return verdict(label + ' — o relógio do som não anda; o motor fica à espera.', false);
    if (r.clicks + r.tones === 0)
      return verdict(label + ' — o motor não marcou nada' +
                     (r.status ? '. A app diz: "' + r.status + '"' : '.'), false);
    verdict(label + ' — o motor marcou ' + r.clicks + ' cliques e ' + r.tones +
            ' notas. Ouviste?', true);
  }

  /* A fresh app has no scale chosen — that is the rule — so the scale round
     picks one the way the buttons do before pressing Start. */
  var pickScale = 'state.scaleGroup="gregorian";' +
                  'state.scaleName=Object.keys(SCALES.gregorian)[0];' +
                  'refreshSequence();';
  round('metro', '', 2500, function(a){
    judge(a, '6 — metrónomo');
    round('scale', pickScale, 6000, function(b){
      judge(b, '6 — escala');
      if (appErrors.length) verdict('Erro na app: ' + appErrors[0], false);
    });
  });
};

document.getElementById('bcopy').onclick = function(){
  var t = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function(){ say('(report copied)'); },
                                          function(){ bad('copy refused — screenshot instead'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); say('(report copied)'); }
    catch (e) { bad('copy unavailable — screenshot instead'); }
    document.body.removeChild(ta);
  }
};
</script>
</body>
</html>
